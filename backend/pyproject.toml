[project]
name = "shine-video-studio"
version = "0.2.0"
description = "Local-first MiniMax H3 short-drama production workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.2",
  "fastapi==0.116.1",
  "python-multipart==0.0.20",
  "pydantic==2.11.7",
  "python-dotenv==1.2.4",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.35.0",
  "httpx==0.28.1",
  "jsonschema==4.23.0",
  "pypdf==5.6.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.3",
  "imageio-ffmpeg==0.6.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
