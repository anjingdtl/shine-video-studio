name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_tier:
        description: Select a local validation tier. Use full for important PRs and releases.
        required: true
        type: choice
        default: full
        options:
          - quick
          - integration
          - full

concurrency:
  # Push and pull_request events for the same branch share a group. A PR update
  # therefore cancels the equivalent push run, while newer commits supersede
  # older work. An explicit manual acceptance run has its own group.
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-l1:
    name: L1 backend quick
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.test_tier == 'quick' || inputs.test_tier == 'integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Some backend contracts execute the shipped TypeScript setup service.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: uv run --project backend python scripts/run_tests.py quick

  backend-l2:
    name: L2 backend integration
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.test_tier == 'integration')
    needs: backend-l1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: uv run --project backend python scripts/run_tests.py integration

  frontend:
    name: Frontend build
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.test_tier == 'integration' || inputs.test_tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build

  backend-l3-linux:
    name: L3 backend full (Linux)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.test_tier == 'full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: uv run --project backend python scripts/run_tests.py full

  backend-l3-windows:
    name: L3 backend full (Windows)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.test_tier == 'full')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - name: Full backend suite, Ruff, and isolated migration
        run: uv run --project backend python scripts/run_tests.py full
      - name: Windows API and Worker mock smoke
        shell: pwsh
        run: |
          $env:SHINE_DATA_DIR = Join-Path $env:RUNNER_TEMP 'shine-worker-smoke'
          ./scripts/verify_local_stack.ps1 -ApiPort 8127
      - name: Windows owned stack start, proxy and stop regression
        shell: pwsh
        run: ./scripts/verify_stack_operations.ps1

  web-e2e:
    name: L3 browser E2E
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.test_tier == 'full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: npm ci --prefix frontend
      - name: Install browser and media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          uv run --project backend --with playwright==1.62.0 python -m playwright install --with-deps chromium
      - name: Browser approval and voice flow on an isolated database
        run: |
          uv run --project backend ruff check scripts/verify_v13_web.py
          uv run --project backend --with playwright==1.62.0 python scripts/verify_v13_web.py --screenshot "${{ runner.temp }}/shine-v13-web-qa.png"
      - name: Upload optional browser screenshot
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: v13-browser-evidence
          path: ${{ runner.temp }}/shine-v13-web-qa.png
          if-no-files-found: warn
