[package]
name = "shine-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Native Windows launcher for Shine Video Studio"
license = "MIT"

[dependencies]
slint = { version = "=1.12.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
sysinfo = { version = "=0.33.1", default-features = false, features = ["system", "disk"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
fs2 = "=0.4.3"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
semver = "=1.0.28"
url = "=2.5.8"
serde_jcs = "=0.2.0"
ureq = { version = "=2.12.1", default-features = false, features = ["proxy-from-env", "json"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "=0.15.3", default-features = false }
ureq = { version = "=2.12.1", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.15.3", default-features = false, features = ["xdg-portal", "async-std"] }
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "native-certs"] }

[build-dependencies]
slint-build = "=1.12.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
